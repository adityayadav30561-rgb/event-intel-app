# Render Blueprint for the API (free plan). See docs/RUNBOOK.md for the one-time setup.
services:
  - type: web
    name: event-intel-api
    runtime: node
    plan: free
    # Same region as the Neon database (AWS Singapore) to keep queries fast.
    region: singapore
    buildCommand: npm ci --include=dev && npm run build --workspace @eii/api
    startCommand: npm run start:prod --workspace @eii/api
    # Liveness only — does not wake the free database.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Paste the Neon connection string in the Render dashboard; never commit it.
        sync: false
      - key: CRON_SECRET
        # Render generates a random secret; copy it into the cron-job.org job header.
        generateValue: true
      - key: DEMO_DATA
        # Set in the dashboard: true = sample events, false = real sources only (see docs/SOURCES.md).
        sync: false
      - key: SOURCES_ENABLED
        # Comma-separated source ids to read, set in the dashboard (docs/SOURCES.md).
        sync: false
      - key: CURATED_SHEET_URL
        # Optional: the team Google Sheet published as CSV.
        sync: false
      - key: ADMIN_EMAIL
        # Your account (the first admin), created on start if it doesn't exist yet. Set in the dashboard.
        sync: false
      - key: ADMIN_PASSWORD
        # Its first password, typed by you in the dashboard. Can be removed after your first sign-in.
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: LOG_LEVEL
        value: info
